specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Spreadsheets
providerId: spreadsheets
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Spreadsheets
  - Data
  - Google Sheets
  - Excel
  - Rate Limiting
description: This catalog entry aggregates several spreadsheet APIs (Google
  Sheets, Microsoft Graph Excel, SheetDB, Sheety). Each has its own rate-limit
  documentation; there is no unified throttle policy.
sources:
  - https://developers.google.com/sheets/api/limits
  - https://learn.microsoft.com/graph/throttling
  - https://docs.sheetdb.io/
  - https://sheety.co/docs
notes: Aggregator slug; consult each underlying provider for real per-second
  / per-minute limits.
responseCodes:
  throttled: 429
limits:
  - name: Per-Component-Provider Limits
    scope: varies
    metric: varies
    limit: see component provider documentation
    notes: Google Sheets API publishes per-minute / per-user / per-project
      quotas; Microsoft Graph publishes throttling policies per resource;
      SheetDB and Sheety publish their own per-plan request caps.
policies:
  - name: Defer to Component Providers
    description: Throttling policy is whatever the underlying provider enforces.
      No aggregator-level policy applies.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
