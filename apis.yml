aid: spreadsheets
name: Spreadsheets
kind: topic
description: >-
  Spreadsheets covers the APIs, tools, and services for programmatic access to spreadsheet data across major platforms
  including Google Sheets and Microsoft Excel. The Google Sheets API v4 provides RESTful access to read, write, format,
  and manage Google Spreadsheets. The Microsoft Graph Excel API enables reading and writing Excel workbooks stored in
  OneDrive for Business and SharePoint. Third-party services like SheetDB, Sheety, Sheet Best, and Sheet2API convert
  spreadsheets into REST APIs for use as lightweight backends. Spreadsheet APIs are widely used for data import/export,
  automated reporting, form submissions, lightweight CMS, and business process automation.
