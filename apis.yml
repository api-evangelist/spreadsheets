    url: https://docs.sheetdb.io/
  - type: Website
    url: https://sheetdb.io/
- aid: spreadsheets:sheety
  name: Sheety
  description: >-
    Sheety converts Google Spreadsheets into RESTful JSON APIs, providing simple HTTP endpoints for reading
    and writing spreadsheet data. Supports GET, POST, PUT, PATCH, and DELETE operations with optional
    API key authentication.
  humanURL: https://sheety.co/
  baseURL: https://api.sheety.co
