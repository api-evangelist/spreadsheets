naftiko: 1.0.0-alpha2
info:
  label: Google Sheets API — Developer Metadata
  description: 'Google Sheets API — Developer Metadata. 2 operations. Lead operation: Get Developer Metadata. Self-contained
    Naftiko capability covering one Spreadsheets business surface.'
  tags:
  - Spreadsheets
  - Developer Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPREADSHEETS_API_KEY: SPREADSHEETS_API_KEY
capability:
  consumes:
  - type: http
    namespace: google-sheets-developer-metadata
    baseUri: https://sheets.googleapis.com/v4
    description: Google Sheets API — Developer Metadata business capability. Self-contained, no shared references.
    resources:
    - name: spreadsheets-spreadsheetId-developerMetadata-metadataId
      path: /spreadsheets/{spreadsheetId}/developerMetadata/{metadataId}
      operations:
      - name: getdevelopermetadata
        method: GET
        description: Get Developer Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: metadataId
          in: path
          type: integer
          required: true
    - name: spreadsheets-spreadsheetId-developerMetadata:search
      path: /spreadsheets/{spreadsheetId}/developerMetadata:search
      operations:
      - name: searchdevelopermetadata
        method: POST
        description: Search Developer Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SPREADSHEETS_API_KEY}}'
  exposes:
  - type: rest
    namespace: google-sheets-developer-metadata-rest
    port: 8080
    description: REST adapter for Google Sheets API — Developer Metadata. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/spreadsheets/{spreadsheetid}/developermetadata/{metadataid}
      name: spreadsheets-spreadsheetid-developermetadata-metadataid
      description: REST surface for spreadsheets-spreadsheetId-developerMetadata-metadataId.
      operations:
      - method: GET
        name: getdevelopermetadata
        description: Get Developer Metadata
        call: google-sheets-developer-metadata.getdevelopermetadata
        with:
          spreadsheetId: rest.spreadsheetId
          metadataId: rest.metadataId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/spreadsheets/{spreadsheetid}/developermetadata-search
      name: spreadsheets-spreadsheetid-developermetadata-search
      description: REST surface for spreadsheets-spreadsheetId-developerMetadata:search.
      operations:
      - method: POST
        name: searchdevelopermetadata
        description: Search Developer Metadata
        call: google-sheets-developer-metadata.searchdevelopermetadata
        with:
          spreadsheetId: rest.spreadsheetId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: google-sheets-developer-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Sheets API — Developer Metadata. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-developer-metadata
      description: Get Developer Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-sheets-developer-metadata.getdevelopermetadata
      with:
        spreadsheetId: tools.spreadsheetId
        metadataId: tools.metadataId
      outputParameters:
      - type: object
        mapping: $.
    - name: search-developer-metadata
      description: Search Developer Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: google-sheets-developer-metadata.searchdevelopermetadata
      with:
        spreadsheetId: tools.spreadsheetId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
