naftiko: "1.0.0-alpha1"

info:
  label: "Google Sheets API"
  description: "Shared capability definition for the Google Sheets API v4, providing spreadsheet creation, cell value read/write, batch operations, and sheet management."
  tags:
    - Google Sheets
    - Spreadsheets
    - Data
    - Productivity
    - Google Workspace
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      GOOGLE_ACCESS_TOKEN: GOOGLE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: google-sheets
      baseUri: https://sheets.googleapis.com/v4
      description: "Google Sheets API v4 for reading and writing spreadsheet data"
      authentication:
        type: bearer
        token: "{{GOOGLE_ACCESS_TOKEN}}"
      resources:
        - name: spreadsheet
          path: /spreadsheets/{spreadsheetId}
          description: "Spreadsheet resource"
          operations:
            - name: get-spreadsheet
              method: GET
              description: "Get spreadsheet metadata and structure"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
                - name: includeGridData
                  in: query
                  type: boolean
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: values
          path: /spreadsheets/{spreadsheetId}/values/{range}
          description: "Cell values by range"
          operations:
            - name: get-values
              method: GET
              description: "Read cell values from a range"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
                - name: range
                  in: path
                  type: string
                  required: true
                - name: majorDimension
                  in: query
                  type: string
                  required: false
                - name: valueRenderOption
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: values
                  type: array
                  value: "$.values"
                - name: range
                  type: string
                  value: "$.range"
            - name: update-values
              method: PUT
              description: "Write cell values to a range"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
                - name: range
                  in: path
                  type: string
                  required: true
                - name: valueInputOption
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  range: "{{tools.range}}"
                  values: "{{tools.values}}"

        - name: values-append
          path: /spreadsheets/{spreadsheetId}/values/{range}:append
          description: "Append values to a spreadsheet"
          operations:
            - name: append-values
              method: POST
              description: "Append rows to the end of an existing table"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
                - name: range
                  in: path
                  type: string
                  required: true
                - name: valueInputOption
                  in: query
                  type: string
                  required: true
                - name: insertDataOption
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  values: "{{tools.values}}"

        - name: values-batch-get
          path: /spreadsheets/{spreadsheetId}/values:batchGet
          description: "Batch read multiple ranges"
          operations:
            - name: batch-get-values
              method: GET
              description: "Read multiple ranges in a single API call"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
                - name: ranges
                  in: query
                  type: array
                  required: true
                - name: majorDimension
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: valueRanges
                  type: array
                  value: "$.valueRanges"

        - name: values-batch-update
          path: /spreadsheets/{spreadsheetId}/values:batchUpdate
          description: "Batch write multiple ranges"
          operations:
            - name: batch-update-values
              method: POST
              description: "Write to multiple ranges in a single API call"
              inputParameters:
                - name: spreadsheetId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  valueInputOption: "{{tools.valueInputOption}}"
                  data: "{{tools.data}}"

  exposes:
    - type: rest
      port: 8100
      namespace: google-sheets-rest
      resources:
        - path: /v1/spreadsheets/{spreadsheetId}/values/{range}
          name: values
          operations:
            - method: GET
              name: get-values
              description: "Read values from a spreadsheet range"
              call: "google-sheets.get-values"
              with:
                spreadsheetId: "rest.spreadsheetId"
                range: "rest.range"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: google-sheets-mcp
      transport: http
      tools:
        - name: read-sheet-values
          description: "Read cell values from a Google Sheet range"
          hints:
            readOnly: true
            openWorld: false
          call: "google-sheets.get-values"
          with:
            spreadsheetId: "tools.spreadsheetId"
            range: "tools.range"
          outputParameters:
            - type: object
              mapping: "$."
