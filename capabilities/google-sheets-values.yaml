    resources:
    - name: spreadsheets-spreadsheetId-values-range
      path: /spreadsheets/{spreadsheetId}/values/{range}
      operations:
      - name: getvalues
        method: GET
        description: Get Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: range
          in: path
          type: string
          description: The A1 notation or R1C1 notation of the range to retrieve values from
          required: true
        - name: majorDimension
          in: query
          type: string
          description: The major dimension that results should use
        - name: valueRenderOption
          in: query
          type: string
          description: How values should be represented in the output
        - name: dateTimeRenderOption
          in: query
          type: string
          description: How dates, times, and durations should be represented
      - name: updatevalues
        method: PUT
        description: Update Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: range
          in: path
          type: string
          required: true
        - name: valueInputOption
          in: query
          type: string
          description: How the input data should be interpreted
          required: true
        - name: includeValuesInResponse
          in: query
          type: boolean
        - name: responseValueRenderOption
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: spreadsheets-spreadsheetId-values-range}:append
      path: /spreadsheets/{spreadsheetId}/values/{range}:append
      operations:
      - name: appendvalues
        method: POST
        description: Append Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: range
          in: path
          type: string
          required: true
        - name: valueInputOption
          in: query
          type: string
          required: true
        - name: insertDataOption
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: spreadsheets-spreadsheetId-values-range}:clear
      path: /spreadsheets/{spreadsheetId}/values/{range}:clear
      operations:
      - name: clearvalues
        method: POST
        description: Clear Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: range
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: spreadsheets-spreadsheetId-values:batchClear
      path: /spreadsheets/{spreadsheetId}/values:batchClear
      operations:
      - name: batchclearvalues
        method: POST
        description: Batch Clear Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
