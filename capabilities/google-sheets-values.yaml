          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: spreadsheets-spreadsheetId-values:batchGet
      path: /spreadsheets/{spreadsheetId}/values:batchGet
      operations:
      - name: batchgetvalues
        method: GET
        description: Batch Get Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: ranges
          in: query
          type: array
          required: true
        - name: majorDimension
          in: query
          type: string
        - name: valueRenderOption
          in: query
          type: string
    - name: spreadsheets-spreadsheetId-values:batchUpdate
      path: /spreadsheets/{spreadsheetId}/values:batchUpdate
      operations:
      - name: batchupdatevalues
        method: POST
        description: Batch Update Values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: spreadsheetId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SPREADSHEETS_API_KEY}}'
  exposes:
  - type: rest
    namespace: google-sheets-values-rest
    port: 8080
    description: REST adapter for Google Sheets API — Values. One Spectral-compliant resource per consumed operation, prefixed
